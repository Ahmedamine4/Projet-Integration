services:
  backend:
    build:
      context: ../../backend
      target: production
    env_file:
      - ../../backend/.env
    environment:
      - NODE_ENV=production
    image: tijabdel/backend:prod

  frontend:
    build:
      context: ../../frontend
      target: production
    environment:
      - NODE_ENV=production
    image: tijabdel/frontend:prod
  ai:
    build:
      context: ../../ai
      target: production
    environment:
      - ENV=production
    image: tijabdel/ai:prod

  nginx:
    volumes:
      - ../nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    image: tijabdel/nginx:prod