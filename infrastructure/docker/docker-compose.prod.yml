services:
  backend:
    build:
      context: ../../backend
      target: production
    env_file:
      - ../../backend/.env
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ../../frontend
      target: production
    environment:
      - NODE_ENV=production

  ai:
    build:
      context: ../../ai
      target: production
    environment:
      - ENV=production

  nginx:
    volumes:
      - ../nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro