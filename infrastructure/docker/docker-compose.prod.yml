services:
  backend:
    build:
      context: ../../backend
      target: production
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ../../frontend
      target: production
    # ports:
    #   - "80:80" car nginx va faire le reverse proxy via le port 80
    environment:
      - NODE_ENV=production

  ai:
    build:
      context: ../../ai
      target: production
    environment:
      - ENV=production
  
  nginx:
    volumes:
      - ../nginx/default.prod.conf:/etc/nginx/conf.d/default.conf