services:
  backend:
    build:
      context: ../../backend
      target: production
    env_file:
      - ../../backend/.env
    environment:
      - NODE_ENV=production
    image: ahmedamine04/foliocraft:backend

  frontend:
    build:
      context: ../../frontend
      target: production
    environment:
      - NODE_ENV=production
    image: ahmedamine04/foliocraft:frontend
  ai:
    build:
      context: ../../ai
      target: production
    environment:
      - ENV=production
    image: ahmedamine04/foliocraft:ai

  nginx:
    volumes:
      - ../nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    image: ahmedamine04/foliocraft:nginx