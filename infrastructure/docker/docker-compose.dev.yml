services:
  backend:
    build:
      context: ../../backend
      target: development
    volumes:
      - ../../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ../../frontend
      target: development
    ports:
      - "5173:5173" # On expose le port 5173 pour le développement sinon nginx ne pourra pas faire le reverse proxy
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true ## Activé uniquement en développement pour garantir le hot-reload avec Docker

  ai:
    build:
      context: ../../ai
      target: development
    volumes:
      - ../../ai:/app
    environment:
      - ENV=development
  
  nginx:
    volumes:
      - ../nginx/default.dev.conf:/etc/nginx/conf.d/default.conf