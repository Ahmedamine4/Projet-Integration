services:
  backend:
    build:
      context: ../../backend
      target: development
    volumes:
      - ../../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  prisma-studio:
    container_name: prisma-studio
    build:
      context: ../../backend
      target: development
    env_file:
      - ../../backend/.env
    volumes:
      - ../../backend:/app
      - /app/node_modules
    ports:
      - "5555:5555"
    command: npx prisma studio --hostname 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

  ai:
    build:
      context: ../../ai
      target: development
    environment:
      - ENV=development

  nginx:
    volumes:
      - ../nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro