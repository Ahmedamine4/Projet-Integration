services:
  backend:
   # ports: supp car j'ai ajouter studio prisma comme un service 
    #  - "5555:5555"  # Prisma Studio seulement en dev , sinn N'importe qui pourrait acceder a toutes tes donnees !!
    build:
      context: ../../backend
      target: development
    volumes:
      - ../../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

    #  NOUVEAU SERVICE !! , POUR ACCEDER A PRISMA STUDIO RAPIDEMENT, Plus besoin de la longue commande ! 
  prisma-studio:
    container_name: prisma-studio
    build:
      context: ../../backend
      target: development
    env_file:
      - ../../backend/.env          #  variables chargées automatiquement
    volumes:
      - ../../backend:/app
      - /app/node_modules
    ports:
      - "5555:5555"    #  port accessible directement
    command: npx prisma studio --hostname 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ../../frontend
      target: development
    ports:
      - "5173:5173" # On expose le port 5173 pour le développement sinon nginx ne pourra pas faire le reverse proxy
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true ## Activé uniquement en développement pour garantir le hot-reload avec Docker

  ai:
    build:
      context: ../../ai
      target: development
    environment:
      - ENV=development
  
  nginx:
    volumes:
      - ../nginx/default.dev.conf:/etc/nginx/conf.d/default.conf