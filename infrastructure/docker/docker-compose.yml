services:
  backend:
    container_name: back-app-container
    ports:
      - "3000:3000"
      #- "5555:5555" # Port pour le WebSocket
    build:
      context: ../../backend
    env_file:
      - ../../backend/.env
# Les volumes ont été retirés du fichier global pour respecter la séparation dev/prod !!
   # command: npm run dev :  Pas de "command" ici pour éviter d'écraser le CMD du Dockerfile
# Le CMD inclut déjà les migrations Prisma + le lancement du serveur !!
    depends_on:
      db:
        condition: service_healthy
  frontend:
    container_name: frontend-container
    build:
      context: ../../frontend
      #target: development # pour nginx
    # ports:
    #   - "5173:5173"  gerer au niveau de nginx pour le reverse proxy
    depends_on:
      - backend
# Les volumes ont été retirés pour respecter la séparation entre développement et production , comme le backend
#meme chose pour CHOKIDAR_USEPOLLING=true, non utilisé en production car inutile
  db:
    image: postgres:16-alpine
    container_name: postgres-db-container
    restart: always
    env_file:
    - ../../backend/.env
    volumes:
      - postgres-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  ai:
    container_name: ai-container
    build:
      context: ../../ai
    ports:
      - "8000:8000"
    depends_on:
      - db
    security_opt:
      - seccomp:unconfined # Permet à ONNX Runtime d'utiliser les fonctionnalités nécessaires pour l'inférence
  nginx:
    container_name: nginx-proxy
    build:
      context: ../../infrastructure/nginx
    ports:
      - "80:80"
      - "443:443" # On expose le port 443 pour HTTPS
    volumes:
      - nginx-certs:/etc/nginx/ssl # Volume pour garder les certs
    depends_on:
      - frontend
      - backend


volumes:
  postgres-db:
  nginx-certs: # Volume pour stocker les certificats TLS de Nginx
