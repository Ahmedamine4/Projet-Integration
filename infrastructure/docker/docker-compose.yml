services:
  backend:
    container_name: back-app-container
    ports:
      - "3000:3000"
      - "5555:5555" # Port pour le WebSocket
    build:
      context: ../../backend
    env_file:
      - ../../backend/.env
    volumes:
    - ../../backend:/app
    - /app/node_modules
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
  frontend:
    container_name: frontend-container
    build:
      context: ../../frontend
      #target: development # pour nginx
    # ports:
    #   - "5173:5173"  gerer au niveau de nginx pour le reverse proxy
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
  db:
    image: postgres:16-alpine
    container_name: postgres-db-container
    restart: always
    env_file:
    - ../../backend/.env
    volumes:
      - postgres-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  ai:
    container_name: ai-container
    build:
      context: ../../ai
    ports:
      - "8000:8000"
    depends_on:
      - db
  nginx:
    container_name: nginx-proxy
    build:
      context: ../../infrastructure/nginx
    ports:
      - "80:80"
      - "443:443" # On expose le port 443 pour HTTPS
    volumes:
      - nginx-certs:/etc/nginx/ssl # Volume pour garder les certs
    depends_on:
      - frontend
      - backend


volumes:
  postgres-db:
  nginx-certs: # Volume pour stocker les certificats TLS de Nginx
