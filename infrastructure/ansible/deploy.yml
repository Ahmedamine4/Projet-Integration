---
- name: Deploy backend and frontend containers
  hosts: backend_servers
  become: true
  gather_facts: true

  vars:
    db_port: "5432"
    db_name: "portfolio_db"
    db_user: "portfolio_user"

    api_url: "https://{{ cloudfront_api_domain }}/api"
    supabase_url: "https://xfnburehcqkcmebvpfqh.supabase.co"
    github_client_id: "Ov23liLr8BGE52aNeqd9"

    docker_backend_image: "tijabdel/backend:prod"
    docker_frontend_image: "tijabdel/frontend:prod"
    backend_port: 3000
    frontend_host_port: 80
    frontend_container_port: 80

  pre_tasks:
    - name: Validate required deployment variables
      ansible.builtin.assert:
        that:
          - db_host is defined
          - db_host | length > 0
          - db_password is defined
          - db_password | length > 0
          - jwt_secret is defined
          - jwt_secret | length > 0
          - jwt_refresh_secret is defined
          - jwt_refresh_secret | length > 0
          - supabase_service_role_key is defined
          - supabase_service_role_key | length > 0
          - github_client_secret is defined
          - github_client_secret | length > 0
          - cloudfront_api_domain is defined
          - cloudfront_api_domain | length > 0
        fail_msg: "Missing required variables. Run deploy.sh so Terraform outputs and secrets are passed to Ansible."

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker dependencies
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - python3-docker
          - python3-requests
        state: present

    - name: Check if Docker is installed
      ansible.builtin.command: which docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Download Docker install script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"
      when: docker_check.rc != 0

    - name: Install Docker
      ansible.builtin.command: /tmp/get-docker.sh
      when: docker_check.rc != 0

    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: admin
        groups: docker
        append: true

    - name: Reset ssh connection after group change
      ansible.builtin.meta: reset_connection

    - name: Remove old backend container
      ansible.builtin.command: docker rm -f portfolio-backend
      changed_when: true
      failed_when: false

    - name: Pull backend image
      ansible.builtin.command: docker pull {{ docker_backend_image }}
      changed_when: true

    - name: Deploy backend container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - portfolio-backend
          - --restart
          - always
          - -p
          - "{{ backend_port }}:3000"
          - -e
          - "DATABASE_URL=postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}?schema=public"
          - -e
          - NODE_ENV=production
          - -e
          - PORT=3000
          - -e
          - "SUPABASE_URL={{ supabase_url }}"
          - -e
          - "SUPABASE_SERVICE_ROLE_KEY={{ supabase_service_role_key }}"
          - -e
          - "JWT_SECRET={{ jwt_secret }}"
          - -e
          - JWT_EXPIRES_IN=2h
          - -e
          - "JWT_REFRESH_SECRET={{ jwt_refresh_secret }}"
          - -e
          - JWT_REFRESH_EXPIRES_IN=7d
          - -e
          - "GITHUB_CLIENT_ID={{ github_client_id }}"
          - -e
          - "GITHUB_CLIENT_SECRET={{ github_client_secret }}"
          - "{{ docker_backend_image }}"
      changed_when: true

    - name: Wait for backend to start
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ backend_port }}"
        delay: 5
        timeout: 60

    - name: Check backend health
      ansible.builtin.uri:
        url: "http://localhost:{{ backend_port }}/"
        method: GET
        status_code: 200
      register: backend_health
      retries: 5
      delay: 5
      until: backend_health.status == 200
      failed_when: false

    - name: Remove old frontend container
      ansible.builtin.command: docker rm -f portfolio-frontend
      changed_when: true
      failed_when: false

    - name: Pull frontend image
      ansible.builtin.command: docker pull {{ docker_frontend_image }}
      changed_when: true

    - name: Deploy frontend container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - portfolio-frontend
          - --restart
          - always
          - -p
          - "{{ frontend_host_port }}:{{ frontend_container_port }}"
          - -e
          - "VITE_API_BASE_URL={{ api_url }}"
          - -e
          - "VITE_SUPABASE_URL={{ supabase_url }}"
          - -e
          - VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ZQQ8oG_TDafB9ZbN49Qexg_1olm0MsT
          - "{{ docker_frontend_image }}"
      changed_when: true

    - name: Wait for frontend to start
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ frontend_host_port }}"
        delay: 5
        timeout: 60

    - name: Check frontend health
      ansible.builtin.uri:
        url: "http://localhost:{{ frontend_host_port }}/"
        method: GET
        status_code: 200
      register: frontend_health
      retries: 5
      delay: 5
      until: frontend_health.status == 200
      failed_when: false

    - name: Get running containers
      ansible.builtin.command: docker ps --format '{{ "{{" }} .Names {{ "}}" }}'
      register: running_containers
      changed_when: false

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Deployment summary
          ==================
          Backend:
            Image: {{ docker_backend_image }}
            Status: {{ 'RUNNING' if 'portfolio-backend' in running_containers.stdout else 'FAILED' }}
            Port: {{ backend_port }}
            Health: {{ 'HEALTHY' if backend_health.status == 200 else 'UNHEALTHY' }}

          Frontend:
            Image: {{ docker_frontend_image }}
            Status: {{ 'RUNNING' if 'portfolio-frontend' in running_containers.stdout else 'FAILED' }}
            Port: {{ frontend_host_port }}
            Health: {{ 'HEALTHY' if frontend_health.status == 200 else 'UNHEALTHY' }}

          Hostname: {{ ansible_hostname }}
          Private IP: {{ ansible_default_ipv4.address }}

    - name: Get backend logs if health check failed
      ansible.builtin.command: docker logs portfolio-backend
      register: backend_logs
      when: backend_health.status != 200
      changed_when: false
      failed_when: false

    - name: Print backend logs
      ansible.builtin.debug:
        msg: "{{ backend_logs.stdout }}"
      when: backend_health.status != 200
