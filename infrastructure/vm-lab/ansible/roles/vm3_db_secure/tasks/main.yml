---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required and security packages
  apt:
    name:
      - curl
      - git
      - net-tools
      - ufw
      - fail2ban
      - unattended-upgrades
      - docker.io
      - docker-compose
      - prometheus-node-exporter
    state: present

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    backup: true

- name: Reload SSH
  service:
    name: ssh
    state: reloaded

- name: Enable unattended security upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Enable and start fail2ban
  service:
    name: fail2ban
    enabled: true
    state: started

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: true

- name: Create VM3 docker-compose.yml
  copy:
    dest: /home/vagrant/docker-compose.yml
    owner: vagrant
    group: vagrant
    mode: "0644"
    content: |
      services:
        postgres:
          image: postgres:16-alpine
          container_name: postgres-db-container
          restart: unless-stopped
          env_file:
            - .env
          environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
          ports:
            - "{{ vm3_ip }}:5432:5432"
          volumes:
            - postgres_data:/var/lib/postgresql/data

      volumes:
        postgres_data:

- name: Copy .env to VM with restricted permissions
  copy:
    src: /vagrant/.env
    dest: /home/vagrant/.env
    owner: vagrant
    group: vagrant
    mode: "0600"

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow PostgreSQL only from VM2
  ufw:
    rule: allow
    src: "{{ vm2_ip }}"
    port: "5432"
    proto: tcp

- name: Allow Node Exporter only from VM1
  ufw:
    rule: allow
    src: "{{ vm1_ip }}"
    port: "9100"
    proto: tcp

- name: Enable firewall
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Recreate clean Docker stack
  shell: |
    docker-compose down
    docker-compose up -d --force-recreate --remove-orphans
  args:
    chdir: /home/vagrant

- name: Enable and start Node Exporter
  service:
    name: prometheus-node-exporter
    enabled: true
    state: started