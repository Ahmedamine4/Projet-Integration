---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - git
      - net-tools
      - ufw
      - docker.io
      - docker-compose
      - python3-docker
    state: present

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: true

- name: Create VM3 docker-compose.yml
  copy:
    dest: /home/vagrant/docker-compose.yml
    owner: vagrant
    group: vagrant
    mode: "0640"
    content: |
      services:
        postgres:
          image: postgres:16-alpine
          container_name: postgres-db-container
          restart: unless-stopped
          env_file:
            - .env
          ports:
            - "192.168.56.12:5432:5432"
          volumes:
            - postgres_data:/var/lib/postgresql/data

      volumes:
        postgres_data:

# SÉCURITÉ : UFW avant tout — default deny d'abord
- name: Set default UFW policy to deny incoming
  ufw:
    policy: deny
    direction: incoming

- name: Allow SSH from host only
  ufw:
    rule: allow
    src: "192.168.56.1"
    port: "22"
    proto: tcp

- name: Allow PostgreSQL only from VM2
  ufw:
    rule: allow
    src: "192.168.56.11"
    port: "5432"
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled

- name: Create VM3 .env file
  copy:
    dest: /home/vagrant/.env
    owner: vagrant
    group: vagrant
    mode: "0600"
    force: false
    content: |
      POSTGRES_DB=appdb
      POSTGRES_USER=postgres
      POSTGRES_PASSWORD=postgres

- name: Start VM3 database container
  shell: docker-compose up -d
  args:
    chdir: /home/vagrant
  become: true
  become_user: vagrant
  ignore_errors: true # .env sera créé manuellement après