---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install security and monitoring packages
  apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-transport-https
      - software-properties-common
      - wget
      - gpg
      - prometheus
      - prometheus-node-exporter
    state: present

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    backup: true

- name: Reload SSH
  service:
    name: ssh
    state: reloaded

- name: Enable unattended security upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Enable and start fail2ban
  service:
    name: fail2ban
    enabled: true
    state: started

- name: Create Grafana keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Grafana GPG key
  shell: |
    wget -q -O - https://packages.grafana.com/gpg.key | gpg --dearmor > /etc/apt/keyrings/grafana.gpg
  args:
    creates: /etc/apt/keyrings/grafana.gpg

- name: Add Grafana repository
  copy:
    dest: /etc/apt/sources.list.d/grafana.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://packages.grafana.com/oss/deb stable main

- name: Update apt cache after adding Grafana repo
  apt:
    update_cache: true

- name: Install Grafana
  apt:
    name: grafana
    state: present

- name: Configure Prometheus targets
  copy:
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
    content: |
      global:
        scrape_interval: 15s
        scrape_timeout: 5s

      scrape_configs:
        - job_name: 'vm1-monitoring'
          static_configs:
            - targets: ['{{ vm1_ip }}:9100']

        - job_name: 'vm2-application'
          static_configs:
            - targets: ['{{ vm2_ip }}:9100']

        - job_name: 'vm3-database'
          static_configs:
            - targets: ['{{ vm3_ip }}:9100']

        - job_name: 'vm4-ai'
          static_configs:
            - targets: ['{{ vm4_ip }}:9100']

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow Grafana from private lab network
  ufw:
    rule: allow
    src: "192.168.56.0/24"
    port: "3000"
    proto: tcp

- name: Allow Prometheus from private lab network
  ufw:
    rule: allow
    src: "192.168.56.0/24"
    port: "9090"
    proto: tcp

- name: Allow Node Exporter only from VM1 itself
  ufw:
    rule: allow
    src: "{{ vm1_ip }}"
    port: "9100"
    proto: tcp

- name: Enable firewall
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Enable and start Prometheus
  service:
    name: prometheus
    enabled: true
    state: restarted

- name: Enable and start Grafana
  service:
    name: grafana-server
    enabled: true
    state: started

- name: Enable and start Node Exporter
  service:
    name: prometheus-node-exporter
    enabled: true
    state: started