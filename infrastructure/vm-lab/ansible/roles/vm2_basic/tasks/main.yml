---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required and security packages
  apt:
    name:
      - curl
      - git
      - net-tools
      - ufw
      - fail2ban
      - unattended-upgrades
      - docker.io
      - docker-compose
      - prometheus-node-exporter
    state: present

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    backup: true

- name: Reload SSH
  service:
    name: ssh
    state: reloaded

- name: Enable unattended security upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Enable and start fail2ban
  service:
    name: fail2ban
    enabled: true
    state: started

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: true

- name: Create VM2 docker-compose.yml
  copy:
    dest: /home/vagrant/docker-compose.yml
    owner: vagrant
    group: vagrant
    mode: "0644"
    content: |
      services:
        backend:
          image: tijabdel/backend:prod
          container_name: back-app-container
          restart: unless-stopped
          env_file:
            - .env
          expose:
            - "3000"

        frontend:
          image: tijabdel/frontend:prod
          container_name: frontend-container
          restart: unless-stopped
          expose:
            - "80"

        nginx:
          image: tijabdel/nginx:prod
          container_name: nginx-proxy
          restart: unless-stopped
          depends_on:
            - backend
            - frontend
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certs:/etc/nginx/certs:ro

- name: Create VM2 nginx.conf
  copy:
    dest: /home/vagrant/nginx.conf
    owner: vagrant
    group: vagrant
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name localhost;

          location / {
              proxy_pass http://frontend:80;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /api {
              proxy_pass http://backend:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

- name: Copy .env to VM with restricted permissions
  copy:
    src: /vagrant/.env
    dest: /home/vagrant/.env
    owner: vagrant
    group: vagrant
    mode: "0600"

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP from private lab network
  ufw:
    rule: allow
    src: "192.168.56.0/24"
    port: "80"
    proto: tcp

- name: Allow HTTPS from private lab network
  ufw:
    rule: allow
    src: "192.168.56.0/24"
    port: "443"
    proto: tcp

- name: Allow Node Exporter only from VM1
  ufw:
    rule: allow
    src: "{{ vm1_ip }}"
    port: "9100"
    proto: tcp

- name: Enable firewall
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Recreate clean Docker stack
  shell: |
    docker-compose down
    docker-compose up -d --force-recreate --remove-orphans
  args:
    chdir: /home/vagrant

- name: Enable and start Node Exporter
  service:
    name: prometheus-node-exporter
    enabled: true
    state: started