---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - git
      - net-tools
      - docker.io
      - docker-compose
    state: present

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: true

- name: Create VM2 docker-compose.yml
  copy:
    dest: /home/vagrant/docker-compose.yml
    owner: vagrant
    group: vagrant
    mode: "0640"
    content: |
      services:
        backend:
          image: tijabdel/backend:prod
          container_name: back-app-container
          restart: unless-stopped
          env_file:
            - .env
          ports:
            - "127.0.0.1:3000:3000"  # SÉCURITÉ : backend non exposé publiquement, uniquement via nginx

        frontend:
          image: tijabdel/frontend:prod
          container_name: frontend-container
          restart: unless-stopped

        nginx:
          image: tijabdel/nginx:prod
          container_name: nginx-proxy
          restart: unless-stopped
          depends_on:
            - backend
            - frontend
          ports:
            - "80:80"   # seul port public
          volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # SÉCURITÉ : read-only

- name: Create VM2 nginx.conf
  copy:
    dest: /home/vagrant/nginx.conf
    owner: vagrant
    group: vagrant
    mode: "0640"
    content: |
      server {
          listen 80;
          server_name localhost;

          # SÉCURITÉ : headers de sécurité HTTP
          add_header X-Frame-Options "SAMEORIGIN";
          add_header X-Content-Type-Options "nosniff";
          add_header X-XSS-Protection "1; mode=block";

          location / {
              proxy_pass http://frontend:80;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }

          location /api {
              proxy_pass http://backend:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }

- name: Create VM2 .env file
  copy:
    dest: /home/vagrant/.env
    owner: vagrant
    group: vagrant
    mode: "0600"
    force: false
    content: |
