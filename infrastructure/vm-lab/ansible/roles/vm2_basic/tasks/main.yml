---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - git
      - net-tools
      - docker.io
      - docker-compose
    state: present

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Add vagrant user to docker group
  user:
    name: vagrant
    groups: docker
    append: true

- name: Create VM2 docker-compose.yml
  copy:
    dest: /home/vagrant/docker-compose.yml
    owner: vagrant
    group: vagrant
    mode: "0644"
    content: |
      services:
        backend:
          image: tijabdel/backend:prod
          container_name: back-app-container
          restart: unless-stopped
          env_file:
            - .env
          ports:
            - "3000:3000"

        frontend:
          image: tijabdel/frontend:prod
          container_name: frontend-container
          restart: unless-stopped

        nginx:
          image: tijabdel/nginx:prod
          container_name: nginx-proxy
          restart: unless-stopped
          depends_on:
            - backend
            - frontend
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./certs:/etc/nginx/certs

- name: Create VM2 nginx.conf
  copy:
    dest: /home/vagrant/nginx.conf
    owner: vagrant
    group: vagrant
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name localhost;

          location / {
              proxy_pass http://frontend:80;
          }

          location /api {
              proxy_pass http://backend:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }

- name: Copy .env to VM
  copy:
    src: /vagrant/.env
    dest: /home/vagrant/.env
    owner: vagrant
    group: vagrant
    mode: "0644"

    
- name: Recreate clean Docker stack
  shell: |
    docker-compose down
    docker-compose up -d --force-recreate --remove-orphans
  args:
    chdir: /home/vagrant
    
- name: Install Node Exporter
  apt:
    name: prometheus-node-exporter
    state: present

- name: Start Node Exporter
  service:
    name: prometheus-node-exporter
    enabled: yes
    state: started