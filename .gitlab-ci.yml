stages:
  - lint
  - security
  - test
  - build
  - dast
  - quality
  - deploy


workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  TRIVY_IMAGE: "aquasec/trivy:0.70.0"

# SONARQUBE
sonarqube:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]

  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"

  cache:
    key: sonarqube-cache
    paths:
      - .sonar/cache

  script:
    - sonar-scanner
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.sources=.
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# BACKEND LINT
backend-lint:
  stage: lint
  image: node:24-alpine

  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd backend
    - npm install --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run lint

  rules:
    - changes:
        - backend/**/*

# FRONTEND LINT
frontend-lint:
  stage: lint
  image: node:24-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd frontend
    - npm install --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run lint

  rules:
    - changes:
        - frontend/**/*

# TRIVY - REPOSITORY, DEPENDENCIES, AND SECRETS
trivy-fs:
  stage: security
  image:
    name: "$TRIVY_IMAGE"
    entrypoint: [""]

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - trivy --version
    - trivy fs
      --scanners vuln,secret
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --no-progress
      .

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trivy-fs-report.json

  after_script:
    - trivy fs
      --scanners vuln,secret
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --format json
      --output trivy-fs-report.json
      --no-progress
      .

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# TRIVY - DOCKER, TERRAFORM, NGINX, AND INFRA MISCONFIGURATION
trivy-config:
  stage: security
  image:
    name: "$TRIVY_IMAGE"
    entrypoint: [""]

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 infrastructure/
    - trivy config --severity HIGH,CRITICAL --exit-code 1 backend/Dockerfile
    - trivy config --severity HIGH,CRITICAL --exit-code 1 frontend/Dockerfile
    - trivy config --severity HIGH,CRITICAL --exit-code 1 ai/Dockerfile

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trivy-config-infrastructure.json
      - trivy-config-backend.json
      - trivy-config-frontend.json
      - trivy-config-ai.json

  after_script:
    - trivy config --severity HIGH,CRITICAL --format json --output trivy-config-infrastructure.json infrastructure/
    - trivy config --severity HIGH,CRITICAL --format json --output trivy-config-backend.json backend/Dockerfile
    - trivy config --severity HIGH,CRITICAL --format json --output trivy-config-frontend.json frontend/Dockerfile
    - trivy config --severity HIGH,CRITICAL --format json --output trivy-config-ai.json ai/Dockerfile

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# TRIVY - CONTAINER IMAGE SCAN
trivy-images:
  stage: security
  image:
    name: "$TRIVY_IMAGE"
    entrypoint: [""]

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table ahmedamine04/foliocraft:backend
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table ahmedamine04/foliocraft:frontend
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table ahmedamine04/foliocraft:nginx
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table ahmedamine04/foliocraft:ai

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trivy-image-backend.json
      - trivy-image-frontend.json
      - trivy-image-nginx.json
      - trivy-image-ai.json

  after_script:
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-image-backend.json ahmedamine04/foliocraft:backend || true
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-image-frontend.json ahmedamine04/foliocraft:frontend || true
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-image-nginx.json ahmedamine04/foliocraft:nginx || true
    - trivy image --username "$DOCKER_USERNAME" --password "$DOCKER_TOKEN" --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-image-ai.json ahmedamine04/foliocraft:ai || true

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# FRONTEND TESTS
frontend-tests:
  stage: test
  image: node:24-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd frontend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run test -- --run

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - frontend/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*

# BACKEND TEST PLACEHOLDER
backend-tests:
  stage: test
  image: node:24-alpine

  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd backend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run test --if-present

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*

# DEVELOPMENT DOCKER BUILD
docker-build-dev:
  stage: build

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  before_script:
    - docker version
    - docker compose version

  script:
    - docker compose \
      -f infrastructure/docker/docker-compose.yml \
      -f infrastructure/docker/docker-compose.dev.yml \
      build 

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


docker-push-prod:
  stage: deploy

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  script:
    - docker compose \
      -f infrastructure/docker/docker-compose.yml \
      -f infrastructure/docker/docker-compose.prod.yml \
      build

    - docker push ahmedamine04/foliocraft:backend
    - docker push ahmedamine04/foliocraft:frontend
    - docker push ahmedamine04/foliocraft:ai
    - docker push ahmedamine04/foliocraft:nginx

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


