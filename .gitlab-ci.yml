stages:
  - quality
  - lint
  - security
  - test
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "ci-security-hardening"' # temporary branch for testing security hardening, will be removed after testing
    - when: never

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  TRIVY_IMAGE: "aquasec/trivy:0.70.0"

# SONARQUBE
sonarqube:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]

  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"

  cache:
    key: sonarqube-cache
    paths:
      - .sonar/cache

  script:
    - sonar-scanner
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.sources=.
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "ci-security-hardening"' # temporary branch for testing security hardening, will be removed after testing

# BACKEND LINT
backend-lint:
  stage: lint
  image: node:24-alpine

  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd backend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run lint

  rules:
    - changes:
        - backend/**/*

# FRONTEND LINT
frontend-lint:
  stage: lint
  image: node:24-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd frontend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run lint

  rules:
    - changes:
        - frontend/**/*

# TRIVY - REPOSITORY, DEPENDENCIES, AND SECRETS
trivy-fs:
  stage: security
  image:
    name: "$TRIVY_IMAGE"
    entrypoint: [""]

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - trivy --version
    - trivy fs
      --scanners vuln,secret
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --no-progress
      .

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trivy-fs-report.json

  after_script:
    - trivy fs
      --scanners vuln,secret
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --format json
      --output trivy-fs-report.json
      --no-progress
      .

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "ci-security-hardening"' # temporary branch for testing security hardening, will be removed after testing

# TRIVY - DOCKER, TERRAFORM, NGINX, AND INFRA MISCONFIGURATION
trivy-config:
  stage: security
  image:
    name: "$TRIVY_IMAGE"
    entrypoint: [""]

  cache:
    key: trivy-cache
    paths:
      - .trivycache/

  script:
    - trivy config
      --severity HIGH,CRITICAL
      --exit-code 1
      infrastructure/
    - trivy config
      --severity HIGH,CRITICAL
      --exit-code 1
      backend/Dockerfile
    - trivy config
      --severity HIGH,CRITICAL
      --exit-code 1
      frontend/Dockerfile
    - trivy config
      --severity HIGH,CRITICAL
      --exit-code 1
      ai/Dockerfile

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - trivy-config-report.json

  after_script:
    - trivy config
      --severity HIGH,CRITICAL
      --format json
      --output trivy-config-report.json
      infrastructure/ backend/Dockerfile frontend/Dockerfile ai/Dockerfile

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "ci-security-hardening"' # temporary branch for testing security hardening, will be removed after testing
    
# FRONTEND TESTS
frontend-tests:
  stage: test
  image: node:24-alpine

  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd frontend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run test -- --run

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - frontend/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*

# BACKEND TEST PLACEHOLDER
backend-tests:
  stage: test
  image: node:24-alpine

  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/

  before_script:
    - cd backend
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

  script:
    - npm run test --if-present

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*

# PRODUCTION DOCKER BUILD
docker-build-prod:
  stage: build

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  before_script:
    - docker version
    - docker compose version

  script:
    - docker compose
      -f infrastructure/docker/docker-compose.yml
      -f infrastructure/docker/docker-compose.prod.yml
      build
      --pull

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "ci-security-hardening"' # temporary branch for testing security hardening, will be removed after testing